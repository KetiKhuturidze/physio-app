# Flow: Physio confirms or declines a booking request
# Login as physio → open bookings tab → confirm pending request.
# ⚠️  REQUIRES IMPLEMENTATION: app/(physio)/bookings.tsx is currently an empty shell.
#     This flow will fail until FE-008 (physio bookings screen) is built.
#     Written in advance — run once FE-008 is done.
appId: host.exp.exponent
env:
  EMAIL: physio.e2e@physio.ge
  PASSWORD: TestPass123
---
- launchApp:
    clearState: true

# ── Login as physio ───────────────────────────────────────────────────────────
- runFlow: _login.yaml

# ── Physio dashboard ──────────────────────────────────────────────────────────
# Physio lands on dashboard tab
- assertVisible: "სამართავი პანელი"

# ── Navigate to bookings tab ──────────────────────────────────────────────────
- tapOn: "ჯავშნები"
- waitForAnimationToEnd

